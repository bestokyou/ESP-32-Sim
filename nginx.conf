server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /board/ {
        alias /usr/share/nginx/html/uploads/;
        try_files $uri /uploads/SPU-IoT-ESP32-Simulator.html;
    }
}
